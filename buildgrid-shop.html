<style>
:root{--bg:#EAEDF1;--panel:#fff;--tint:#F3F5F8;--ink:#0F1B2D;--ink2:#3B4A60;--muted:#5D6B80;--line:#D5DBE3;--nav:#0B1F3A;--nav2:#12305A;--hi:#FFC72C;--hi2:#F5B800;--hi-ink:#1F1700;--or:#FF8A1F;--link:#1250C0;--deal:#C7352B;--ok:#147A45;--bad:#B42318;--star:#F5A623;--star-off:#C9D0DB;--shadow:0 10px 30px rgba(11,31,58,.18);
 --disp:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4,p{margin:0}h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;line-height:1.15}h1{font-size:28px}h2{font-size:21px;font-weight:700}h3{font-size:17px}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
.hdr :focus-visible{outline-color:#fff}
.ic{flex:none}.muted{color:var(--muted)}.sm{font-size:13px}.center{text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* header */

/* layout */
main{min-height:70vh;outline:0}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:20px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn.yellow{background:var(--hi);color:var(--hi-ink)}.btn.yellow:hover{background:var(--hi2)}

.stxt{max-width:520px;display:grid;gap:14px;justify-items:start}.stxt h1{font-size:clamp(30px,4vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.02}.stxt p{font-size:clamp(15px,1.5vw,18px);color:rgba(255,255,255,.88)}

.deliv{font-size:13px;color:var(--ink2)}.fast{display:inline-flex;align-items:center;gap:2px;background:var(--nav);color:var(--hi);font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px}

function couponCheck(code,sub){
 const c=String(code||"").trim().toUpperCase();
 if(c==="BUILD10")return sub<2000?{ok:false,msg:"BUILD10 needs an order of ₹2,000 or more"}:{ok:true,msg:"BUILD10 applied: 10% off, up to ₹5,000",disc:Math.min(5000,Math.round(sub*.1))};
 if(c==="FIRST250"){if(DB.orders.some(o=>o.user===DB.session))return {ok:false,msg:"FIRST250 is for your first order only"};return sub<1500?{ok:false,msg:"FIRST250 needs an order of ₹1,500 or more"}:{ok:true,msg:"FIRST250 applied: ₹250 off",disc:250}}
 if(c==="FREESHIP")return sub<500?{ok:false,msg:"FREESHIP needs an order of ₹500 or more"}:{ok:true,msg:"FREESHIP applied: free delivery",disc:0,free:true};
 return {ok:false,msg:"That code is not valid"};
}
function calc(ls,code){
 const sub=ls.reduce((a,l)=>a+l.total,0);let ship=!sub?0:sub>=5000?0:199,disc=0,msg="",ok=false;
 if(code){const c=couponCheck(code,sub);ok=c.ok;msg=c.msg;disc=c.disc||0;if(c.free)ship=0}
 return {sub,ship,disc,total:sub-disc+ship,gst:(sub-disc)*18/118,code:ok?String(code).toUpperCase():null,msg,items:ls.reduce((a,l)=>a+l.q,0)};
}

function rng(seed){return()=>{seed|=0;seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

 $("#acctMenu").innerHTML=u?`<b>Hello, ${esc(u.name)}</b><button type="button" data-go="account">Your account</button><button type="button" data-go="orders">Your orders</button><button type="button" data-go="wishlist">Your wish list (${wish().length})</button><button type="button" data-act="logout">Sign out</button>`:`<button class="btn yellow wide" type="button" data-act="auth" data-m="login">Sign in</button><small>New customer? <button class="lnk" type="button" data-act="auth" data-m="register">Start here</button></small><button type="button" data-go="orders">Your orders</button><button type="button" data-go="wishlist">Your wish list</button>`;
}
function openMenu(on){$("#menu").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);if(on)$("#menu button,#menu a").focus()}
function suggest(q){
 const box=$("#sugg");q=q.trim().toLowerCase();if(!q){box.hidden=true;return}
 const prods=PRODUCTS.filter(p=>(p.name+" "+p.brand).toLowerCase().includes(q)).slice(0,5).map(p=>({t:p.name,go:"product/"+p.id,k:"p"}));
 const cats=CATS.filter(c=>c.toLowerCase().includes(q)).slice(0,2).map(c=>({t:c,s:"in categories",go:"cat/"+c,k:"c"}));
 const l=[...cats,...prods];if(!l.length){box.hidden=true;return}
 box.innerHTML=l.map((x,i)=>`<button type="button" role="option" data-go="${esc(x.go)}" data-i="${i}" aria-selected="false">${ic("search",14)}<span>${esc(x.t)}</span>${x.s?`<small>${x.s}</small>`:""}</button>`).join("");box.hidden=false;
}

/* ---------- router ---------- */
const VIEWS={home:VIEWS_home,search:VIEWS_search,product:VIEWS_product,cart:VIEWS_cart,checkout:VIEWS_checkout,thanks:VIEWS_thanks,orders:VIEWS_orders,order:VIEWS_order,wishlist:VIEWS_wishlist,account:VIEWS_account};
const TITLES={home:"BuildGrid.shop: building materials online",search:"Search",product:"Product",cart:"Shopping cart",checkout:"Checkout",thanks:"Order placed",orders:"Your orders",order:"Order details",wishlist:"Your wish list",account:"Your account"};
let curPath="",currentArg=null,timers=[],skipRender=false;
state.q={};
function setSlide(i){const n=SLIDES.length;state.slide=(i+n)%n;const s=$("#slides");if(!s)return;s.style.transform=`translateX(-${state.slide*100}%)`;$$(".dots button").forEach((b,k)=>b.setAttribute("aria-current",k===state.slide));$$(".slide").forEach((sl,k)=>{sl.setAttribute("aria-hidden",k!==state.slide);$$("button",sl).forEach(b=>b.tabIndex=k===state.slide?0:-1)})}
function tickCd(){const e=$("#cd");if(!e)return;const n=new Date(),end=new Date(n);end.setHours(24,0,0,0);const s=Math.floor((end-n)/1000);e.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,"0")).join(":")}
const AFTER={home(){state.slide=0;if(!reduce)timers.push(setInterval(()=>{if(!$(".hero:hover")&&!$(".hero:focus-within"))setSlide(state.slide+1)},6000));tickCd();timers.push(setInterval(tickCd,1000))}};
function show(path){
 timers.forEach(clearInterval);timers=[];
 const [v,...rest]=path.split("/"),a=rest.length?decodeURIComponent(rest.join("/")):null,view=VIEWS[v]?v:"home";
 curPath=path;currentArg=a;
 $("#app").innerHTML=VIEWS[view](a);
 AFTER[view]&&AFTER[view](a);
 renderHeader();window.scrollTo(0,0);document.title=(view==="product"&&P(a)?P(a).name.slice(0,60):TITLES[view])+" | BuildGrid.shop";
 $("#sugg").hidden=true;$("#acctMenu").hidden=true;openMenu(false);
}
function go(path){
 if(path.startsWith("cat/")){openSearch({cat:path.slice(4)});return}
 if(path==="deals"){openSearch({deal:true});return}
 if(path.startsWith("brand/")){openSearch({q:path.slice(6)});return}
 const h="#/"+path;try{if(location.hash!==h)location.hash=h}catch(e){}
 show(path);
}
window.addEventListener("hashchange",()=>{const p=(location.hash||"").replace(/^#\/?/,"")||"home";if(p!==curPath)show(p)});

/* ---------- actions ---------- */
const lineOf=k=>{const [id,s]=k.split(":").map(Number);return cart().find(x=>x.id===id&&x.s===s)};
const rerender=()=>{const y=scrollY;show(curPath);scrollTo(0,y)};
const ACT={
 dclose(){closeD()},
 auth(t){openAuth(t.dataset.m,state.pend)},demo(){demoLogin()},
 logout(){DB.session=null;state.buy=null;save();$("#acctMenu").hidden=true;toast("You have signed out");if(["orders","order","account","checkout","thanks"].includes(curPath.split("/")[0]))go("home");else{renderHeader();show(curPath)}},
 acct(){$("#acctMenu").hidden=!$("#acctMenu").hidden},menu(){openMenu(true)},closemenu(){openMenu(false)},
 pin(){openD(`<form id="pinForm" class="authbox"><button class="x" type="button" data-act="dclose" aria-label="Close">${ic("x",18)}</button><h2>Choose your location</h2><p class="muted">Delivery dates and options depend on your pincode.</p>${fld("Pincode","pin",`inputmode="numeric" maxlength="6" value="${DB.pin}"`)}<button class="btn yellow wide" type="submit">Apply</button></form>`)},
 scroll(t){const s=t.parentElement.querySelector(".scroller");s.scrollBy({left:t.dataset.d*s.clientWidth*.85,behavior:reduce?"auto":"smooth"})},
 slide(t){t.dataset.i!=null?setSlide(+t.dataset.i):setSlide(state.slide+ +t.dataset.d)},
 slidego(t){const s=SLIDES[+t.dataset.i];s.deal?openSearch({deal:true}):openSearch({cat:s.cat})},
 add(t){const id=+t.dataset.id,q=t.closest("#buy")?getQty(id):1,p=P(id);if(addToCart(id,q))toast(`Added to cart: ${p.name.length>46?p.name.slice(0,45)+"…":p.name}`,"Go to cart",()=>go("cart"))},
 buynow(t){const id=+t.dataset.id;state.buy={id,s:state.sel[id]||0,q:getQty(id)};if(!user())openAuth("login",{go:"checkout"});else go("checkout")},
 checkout(){state.buy=null;if(!cart().some(x=>!x.saved))return;if(!user())openAuth("login",{go:"checkout"});else go("checkout")},
 wish(t){const id=+t.dataset.id,w=wish(),i=w.indexOf(id);i>=0?w.splice(i,1):w.push(id);save();const on=i<0;
  $$(`[data-act=wish][data-id="${id}"]`).forEach(b=>{b.setAttribute("aria-pressed",on);b.classList.toggle("on",on);if(b.classList.contains("btn"))b.innerHTML=`${ic("heart",16)} ${on?"In your wish list":"Add to wish list"}`});
  if(curPath==="wishlist")rerender();toast(on?"Saved to your wish list":"Removed from wish list");renderHeader()},
 bq(t){const id=+currentArg,p=P(id),q=Math.max(1,Math.min(p.stock,getQty(id)+ +t.dataset.d));state.q[id]=q;$("#bq").value=q;updateBuy()},
 seller(t){const id=+currentArg,p=P(id);state.sel[id]=+t.dataset.i;$("#buy").innerHTML=buyBox(p);updateBuy()},
 img(t){const p=P(currentArg),i=+t.dataset.i;$("#gal").innerHTML=galleryMain(p,i);$$(".thumbs button").forEach(b=>{b.classList.toggle("on",b===t);b.setAttribute("aria-current",b===t)})},
 addfbt(){const ids=$$("[data-f=fbt]:checked").map(x=>+x.value);if(!ids.length){toast("Select at least one item");return}ids.forEach(id=>addToCart(id,1));toast(`${ids.length} item${ids.length>1?"s":""} added to cart`,"Go to cart",()=>go("cart"))},
 toreviews(t,e){e.preventDefault();const r=$("#reviews");r&&r.scrollIntoView({behavior:reduce?"auto":"smooth"})},
 helpful(t){const k=t.dataset.k;DB.helpful[k]=(DB.helpful[k]||0)+1;save();t.textContent=DB.helpful[k]+" found this helpful";t.disabled=true},
 review(t){
  if(!user()){openAuth("login");return}const p=P(t.dataset.id);
  openD(`<form id="rvForm" class="authbox" data-id="${p.id}"><button class="x" type="button" data-act="dclose" aria-label="Close">${ic("x",18)}</button><h2>Write a review</h2><p class="muted">${esc(p.name)}</p><fieldset class="rstars"><legend>Overall rating</legend>${[5,4,3,2,1].map(n=>`<input type="radio" name="rs" id="rs${n}" value="${n}" ${n===5?"checked":""}><label for="rs${n}" title="${n} star${n>1?"s":""}"><span class="sr">${n} stars</span></label>`).join("")}</fieldset>${fld("Headline","rv_t",'maxlength="80" placeholder="What matters most?"')}<label class="fl2">Your review<textarea class="field" name="rv_b" rows="4" maxlength="600" placeholder="What did you like or dislike?"></textarea><small class="ferr" data-e="rv_b"></small></label><button class="btn yellow wide" type="submit">Submit</button></form>`)},
 cq(t){const l=lineOf(t.dataset.k),p=P(l.id);l.q=Math.max(1,Math.min(p.stock,l.q+ +t.dataset.d));save();rerender();renderHeader()},
 cdel(t){const l=lineOf(t.dataset.k);cart().splice(cart().indexOf(l),1);save();rerender();renderHeader();toast("Item removed")},
 csave(t){lineOf(t.dataset.k).saved=true;save();rerender();renderHeader();toast("Saved for later")},
 cmove(t){lineOf(t.dataset.k).saved=false;save();rerender();renderHeader()},
 cpclear(){DB.coupon=null;save();rerender()},
 place(){placeOrder()},
 reorder(t){const id=+t.dataset.id;if(addToCart(id,+t.dataset.q||1,0))toast("Added to cart","Go to cart",()=>go("cart"))},
 simulate(t){const o=DB.orders.find(x=>x.id===t.dataset.id);if(o&&o.stage<4){o.stage++;o.times[o.stage]=Date.now();save();rerender();toast("Order status: "+STAGES[o.stage])}},
 cancel(t){const o=DB.orders.find(x=>x.id===t.dataset.id);if(o&&o.stage<2){o.cancelled=true;o.items.forEach(i=>{P(i.id).stock+=i.q});save();rerender();toast("Order cancelled. Refund initiated.")}},
 fcat(t){state.s.cat=t.dataset.c;state.s.brands=[];state.s.page=1;renderSearch()},
 frate(t){state.s.rating=state.s.rating===+t.dataset.r?0:+t.dataset.r;state.s.page=1;renderSearch()},
 fclear(){Object.assign(state.s,{cat:"All",brands:[],price:"",rating:0,fast:false,deal:false,page:1});renderSearch()},
 page(t){state.s.page=+t.dataset.p;renderSearch();scrollTo({top:0})},
 addaddr(){openD(`<form id="adForm" class="authbox"><button class="x" type="button" data-act="dclose" aria-label="Close">${ic("x",18)}</button><h2>Add an address</h2>${addrForm()}<button class="btn yellow wide" type="submit">Save address</button></form>`)},
 adef(t){addrs().forEach(a=>a.def=a.id===t.dataset.id);save();rerender()},
 adel(t){const l=addrs(),i=l.findIndex(a=>a.id===t.dataset.id);l.splice(i,1);save();rerender()}
};
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");
 if(g){e.preventDefault();go(g.dataset.go);return}
 const t=e.target.closest("[data-act]");
 if(t&&ACT[t.dataset.act]){ACT[t.dataset.act](t,e);return}
 if(e.target===dlg)closeD();
 if(!e.target.closest("#acctMenu")&&!e.target.closest("[data-act=acct]"))$("#acctMenu").hidden=true;
 if(!e.target.closest("#sform"))$("#sugg").hidden=true;
});
function readAddr(box){const v=n=>(box.querySelector(`[name=${n}]`)||{value:""}).value.trim();return {id:"a"+Date.now(),name:v("na_name"),phone:v("na_phone"),pin:v("na_pin"),line:v("na_line"),city:v("na_city"),state:v("na_state"),def:!!(box.querySelector("[name=na_def]")||{}).checked}}
function validAddr(a){const E={};if(a.name.length<2)E.na_name="Enter the recipient’s name";if(!/^[6-9]\d{9}$/.test(a.phone))E.na_phone="Enter a valid 10-digit mobile number";if(!/^\d{6}$/.test(a.pin))E.na_pin="Enter a 6-digit pincode";if(a.city.length<2)E.na_city="Enter your town or city";if(a.line.length<5)E.na_line="Enter the site or house address";return E}
document.addEventListener("submit",e=>{
 const f=e.target;if(!f.id)return;e.preventDefault();
 if(f.id==="sform"){openSearch({q:$("#q").value.trim(),cat:$("#scat").value});$("#q").blur();return}
 if(f.id==="authForm")return authSubmit(f);
 if(f.id==="cpForm"){const c=$("#cpIn").value.trim();if(!c){DB.coupon=null}else DB.coupon=c.toUpperCase();save();rerender();return}
 if(f.id==="pinForm"){const v=f.querySelector("[name=pin]").value.trim();if(!/^\d{6}$/.test(v)){f.querySelector("[data-e=pin]").textContent="Enter a valid 6-digit pincode";return}DB.pin=v;save();closeD();renderHeader();show(curPath);toast("Delivering to "+cityOf(v)+" "+v);return}
 if(f.id==="rvForm"){const b=f.querySelector("[name=rv_b]").value.trim(),t=f.querySelector("[name=rv_t]").value.trim();if(b.length<5){f.querySelector("[data-e=rv_b]").textContent="Please write a few words";return}
  const id=f.dataset.id;(DB.reviews[id]=DB.reviews[id]||[]).unshift({name:user().name.split(" ")[0]+" "+(user().name.split(" ")[1]||" ")[0]+".",stars:+f.querySelector("[name=rs]:checked").value,title:t||"My review",body:b,t:Date.now()});save();closeD();if(curPath.startsWith("product/"))rerender();toast("Thanks for your review");return}
 if(f.id==="adForm"){const a=readAddr(f),E=validAddr(a);$$(".ferr",f).forEach(x=>x.textContent="");const k=Object.keys(E);if(k.length){k.forEach(n=>{const x=f.querySelector(`[data-e="${n}"]`);if(x)x.textContent=E[n]});return}const l=addrs();if(a.def)l.forEach(x=>x.def=false);l.push(a);save();closeD();rerender();toast("Address saved")}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.closest&&t.closest(".fl2")){const er=t.closest(".fl2").querySelector(".ferr");if(er)er.textContent=""}
 if(t.id==="q")suggest(t.value);
 else if(t.id==="bq"){const p=P(currentArg),n=Math.max(1,Math.min(p.stock,+t.value||1));state.q[p.id]=n;updateBuy()}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="sort"){state.s.sort=t.value;state.s.page=1;renderSearch()}
 else if(t.dataset&&t.dataset.f==="brand"){const b=state.s.brands;t.checked?b.push(t.value):b.splice(b.indexOf(t.value),1);state.s.page=1;renderSearch()}
 else if(t.dataset&&t.dataset.f==="price"){state.s.price=t.value;state.s.page=1;renderSearch()}
 else if(t.dataset&&t.dataset.f==="fast"){state.s.fast=t.checked;state.s.page=1;renderSearch()}
 else if(t.dataset&&t.dataset.f==="deal"){state.s.deal=t.checked;state.s.page=1;renderSearch()}
 else if(t.dataset&&t.dataset.f==="fbt"){const ids=$$("[data-f=fbt]:checked").map(x=>+x.value);$("#ftot").textContent=inr(ids.reduce((a,id)=>a+P(id).price,0))}
 else if(t.classList&&t.classList.contains("cqi")){const l=lineOf(t.dataset.k),p=P(l.id);l.q=Math.max(1,Math.min(p.stock,Math.round(+t.value)||1));save();rerender();renderHeader()}
 else if(t.name==="pay"){$$(".psub").forEach(s=>s.hidden=s.dataset.p!==t.value)}
 else if(t.name==="addr"){state.co.addr=t.value;$("#naWrap").hidden=t.value!=="new"}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){openMenu(false);$("#sugg").hidden=true;$("#acctMenu").hidden=true}
 const sg=$("#sugg");
 if(!sg.hidden&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&document.activeElement===$("#q")||(!sg.hidden&&sg.contains(document.activeElement)&&(e.key==="ArrowDown"||e.key==="ArrowUp"))){
  e.preventDefault();const items=$$("button",sg),i=items.indexOf(document.activeElement),n=e.key==="ArrowDown"?i+1:i-1;
  if(n<0||n>=items.length){$("#q").focus()}else items[n].focus();
 }
});
