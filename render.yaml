# Render Blueprint — deploy from the repository root (rootDir: app).
# Use with a Supabase PostgreSQL database (persistent) or a paid Render Postgres.
# Set DATABASE_URL and APP_ORIGIN in the Render dashboard; never commit them.
services:
  - type: web
    name: constro-well
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: OTP_ENCRYPTION_KEY
        sync: false
