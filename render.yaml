# Render Blueprint — deploy from the repository root (rootDir: app).
# Use with a Neon Free Postgres database (persistent) or a paid Render Postgres.
# Set DATABASE_URL and APP_ORIGIN in the Render dashboard; never commit them.
services:
  - type: web
    name: constro-well
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: OTP_ENCRYPTION_KEY
        generateValue: true
