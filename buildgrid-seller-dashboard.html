<body>
<div class="app">
 <aside class="side">

  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="sp"></div>
  <div class="storebox"><b id="sbName"></b><span id="sbSub"></span></div>
 </aside>
 <div class="mainc">
  <header class="top">
   <label class="search"><span id="sIc"></span><span class="sr">Search orders</span><input id="gq" type="search" placeholder="Search orders by ID, product or city" autocomplete="off"></label>
   <div class="switch"><span id="stLabel">Accepting orders</span><button id="vac" class="tg" type="button" role="switch" aria-checked="true" aria-label="Accepting new orders" data-act="vac"></button></div>
   <button class="ib" type="button" data-act="bell" aria-label="Notifications" id="bellB"></button>
   <div class="av" id="avt" title="Account" aria-hidden="true"></div>
  </header>
  <div class="pop" id="npop" hidden></div>
  <main id="view" tabindex="-1"></main>
 </div>
</div>
<nav class="bottom" id="bottom" aria-label="Main mobile"></nav>

<dialog id="dlg"></dialog>
<div class="demo" role="group" aria-label="Demo controls"><button type="button" class="dt" data-act="demotoggle" aria-label="Show demo controls">Demo controls</button><small>Demo</small><button type="button" data-act="simorder" class="hi">New order arrives</button><button type="button" data-act="adv">+1 hour</button><button type="button" data-act="adv4">+4 hours</button><button type="button" data-act="adv24">+24 hours</button><button type="button" data-act="reset">Reset</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
function pickStore(){try{const s=window.localStorage;s.setItem("__t","1");s.removeItem("__t");s.real=true;return s}catch(e){const m={};return {real:false,getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}}
const LS=pickStore(),KEY="buildgrid_seller_dash_v1";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ordActions(o){
 const a=[];
 if(o.status==="new")a.push(`<button class="btn yellow" type="button" data-act="accept" data-id="${o.id}">Accept order</button>`,`<button class="btn line" type="button" data-act="reject" data-id="${o.id}">Reject</button>`);
 if(o.status==="accepted")a.push(`<button class="btn line" type="button" data-act="packed" data-id="${o.id}">Mark packed</button>`);
 if(["accepted","packed"].includes(o.status))a.push(`<button class="btn yellow" type="button" data-act="dispatch" data-id="${o.id}">Dispatch</button>`);

function deadline(o){

 if(["accepted","packed"].includes(o.status))return `<span class="pill ${o.late||NOW()>=o.dispatchBy?"bad":"info"}">Dispatch ${left(o.dispatchBy)}</span>`;

 return `<div class="head"><div><h1>Orders</h1><p>Accept within ${ACCEPT_H} hours, dispatch within ${DISP_H} hours, and get paid after the customer’s review window.</p></div></div>
 <div class="tabs" role="group" aria-label="Order status">${FILTERS.map(([id,l2,st])=>`<button type="button" data-act="filter" data-f="${id}" aria-pressed="${ui.filter===id}">${l2}<span>${st?cnt(st):S.orders.length}</span></button>`).join("")}</div>
 ${q?`<div class="note info" style="margin-bottom:12px">${ic("search",16)}<div>Showing results for “${esc(ui.q)}”. <button class="btn line sm" type="button" data-act="clearq">Clear</button></div></div>`:""}
 <section class="card" role="table" aria-label="Orders"><div class="orow hd" role="row"><span>Order</span><span>Product</span><span>Value</span><span class="c4">Buyer</span><span>Status</span><span></span></div>${l.length?l.map(orderRow).join(""):`<p class="empty" style="padding:24px">No orders in this view.</p>`}</section>`;
}
function viewProducts(){
 const q=ui.q.toLowerCase();let l=S.products.filter(p=>p.status!=="archived");
 if(ui.pf==="low")l=l.filter(p=>p.stock<=p.reorder);if(ui.pf==="paused")l=l.filter(p=>p.status==="paused");if(ui.pf==="active")l=l.filter(p=>p.status==="active");
 const act=S.products.filter(p=>p.status==="active").length,pau=S.products.filter(p=>p.status==="paused").length;
 return `<div class="head"><div><h1>Products and inventory</h1><p>Keep stock accurate. Out-of-stock listings are paused automatically so you never miss a promised delivery.</p></div><button class="btn yellow" type="button" data-act="addp">${ic("plus",16)} Add product</button></div>
 <div class="tabs">${[["","All",S.products.length],["active","Active",act],["paused","Paused",pau],["low","Low stock",lowStock().length]].map(([k,n,c])=>`<button type="button" data-act="pfilter" data-pf="${k}" aria-pressed="${ui.pf===k}">${n}<span>${c}</span></button>`).join("")}</div>
 <section class="card"><div class="tw"><table><thead><tr><th>Product</th><th class="n">Price</th><th class="n">Stock</th><th>Status</th><th class="n">Sold, 30 days</th><th></th></tr></thead><tbody>${l.map(p=>`<tr><td><div class="pr">${thumb(p.cat)}<div><b>${esc(p.name)}</b><span class="muted sm">Min order ${p.min} · ${p.w} kg per ${esc(p.unit)}${p.bulk?" · bulk goods":""}</span></div></div></td><td class="n"><b>${inr(p.price)}</b><br><span class="muted sm"><s>${inr(p.mrp)}</s> · ${Math.round((1-p.price/p.mrp)*100)}% off</span></td>
 <td class="n"><div class="stk"><button type="button" data-act="stk" data-id="${p.id}" data-d="-10" aria-label="Remove 10">${ic("minus",14)}</button><input type="number" min="0" value="${p.stock}" data-stock="${p.id}" aria-label="Stock for ${esc(p.name)}"><button type="button" data-act="stk" data-id="${p.id}" data-d="10" aria-label="Add 10">${ic("plus",14)}</button></div>${p.stock<=p.reorder?`<div class="pill ${p.stock===0?"bad":"warn"}" style="margin-top:4px">${p.stock===0?"Out of stock":"Low stock"}</div>`:""}</td>
 <td><button class="tg" type="button" role="switch" aria-checked="${p.status==="active"}" data-act="pstatus" data-id="${p.id}" aria-label="${p.status==="active"?"Pause":"Activate"} ${esc(p.name)}"></button> <span class="sm muted">${p.status==="active"?"Live":"Paused"}</span></td><td class="n">${p.sold.toLocaleString("en-IN")}</td><td class="n"><button class="btn line sm" type="button" data-act="editp" data-id="${p.id}">Edit</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No products in this view.</td></tr>`}</tbody></table></div></section>`;
}
function viewDelivery(){
 return `<div class="head"><div><h1>Delivery setup</h1><p>You deliver with your own vehicles. These settings control where you sell, what you charge and how many trucks you can send.</p></div></div>
 <div class="grid g2"><section class="card pad"><div class="ph"><h2>Service areas</h2><span class="muted sm">${S.areas.length} pincodes</span></div><p class="muted sm" style="margin-bottom:10px">Buyers only see your products if their pincode is on this list.</p><div class="chips">${S.areas.map(a=>`<span class="chip">${a}<button type="button" data-act="delarea" data-a="${a}" aria-label="Remove ${a}">${ic("x",12)}</button></span>`).join("")}</div>
 <form id="fArea" style="display:flex;gap:8px;margin-top:14px"><input class="field" name="pin" inputmode="numeric" maxlength="6" placeholder="Add a 6-digit pincode" aria-label="Pincode"><button class="btn yellow" type="submit">Add</button></form><span class="ferr" id="areaErr" role="alert"></span></section>
 <section class="card pad"><div class="ph"><h2>Delivery charges and capacity</h2></div><form id="fRules" class="grid" data-nosubmit="1"><div class="two">${fld("Free delivery above (₹)","free",`type="number" min="0" value="${S.rules.freeAbove}"`)}${fld("Delivery fee below that (₹)","fee",`type="number" min="0" value="${S.rules.fee}"`)}</div><div><b class="sm">Trucks available per slot</b><div class="two" style="grid-template-columns:repeat(3,1fr);margin-top:6px">${SLOTS.map((s,i)=>`<label class="fl2"><span class="sm muted">${s}</span><input class="field" name="s${i}" type="number" min="0" value="${S.slots[i]}"></label>`).join("")}</div></div><button class="btn yellow" type="button" data-act="saverules">Save delivery rules</button></form></section></div>
 <section class="card pad sec"><div class="ph"><h2>Vehicles and drivers</h2><button class="btn line" type="button" data-act="addveh">${ic("plus",16)} Add vehicle</button></div><div class="tw"><table><thead><tr><th>Vehicle</th><th>Type and capacity</th><th>Driver</th><th>Mobile</th><th></th></tr></thead><tbody>${S.vehicles.map(v=>{const d=drv(v.driver);return `<tr><td><b>${esc(v.no)}</b></td><td>${esc(v.type)}</td><td>${esc(d?d.name:"None")}</td><td>${esc(d?d.phone:"")}</td><td class="n"><button class="btn line sm" type="button" data-act="delveh" data-id="${v.id}">Remove</button></td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No vehicles yet. Add one to start dispatching.</td></tr>`}</tbody></table></div></section>`;
}
function viewPayments(){
 const b=balance(),sett=S.orders.filter(o=>o.status==="settled").sort((a,c)=>c.paid-a.paid),next=new Date(NOW());next.setDate(next.getDate()+((5-next.getDay()+7)%7||7));
 return `<div class="head"><div><h1>Payments</h1><p>Money is held in escrow, then released to you after delivery is accepted and the review window ends.</p></div><div style="display:flex;gap:8px"><button class="btn line" type="button" data-act="stmt">${ic("dl",16)} Download statement</button><button class="btn yellow" type="button" data-act="withdraw">Withdraw ${inr(b.avail)}</button></div></div>
 <div class="grid g4"><div class="card kpi"><span class="l">Available to withdraw</span><b>${inr(b.avail)}</b><span class="muted sm">Next auto payout ${next.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})}</span></div><div class="card kpi"><span class="l">Pending release</span><b>${inr(b.pend)}</b><span class="muted sm">Released after the review window</span></div><div class="card kpi"><span class="l">Frozen by disputes</span><b style="color:${b.frozen?"var(--bad)":"inherit"}">${inr(b.frozen)}</b><span class="muted sm">Until admin decides</span></div><div class="card kpi"><span class="l">Bank account</span><b style="font-size:19px">${esc(S.store.bank)}</b><span class="muted sm">Payouts arrive in 1 working day</span></div></div>
 <section class="card pad sec"><h2 style="margin-bottom:8px">Settled orders</h2><div class="tw"><table><thead><tr><th>Order</th><th>Product</th><th class="n">Items</th><th class="n">Delivery</th><th class="n">Commission</th><th class="n">Penalty</th><th class="n">You received</th><th>Status</th></tr></thead><tbody>${sett.map(o=>`<tr class="clk" data-act="open" data-id="${o.id}"><td><b>${o.id}</b><br><span class="muted sm">${fmtD(o.paid)}</span></td><td>${esc(o.name.split(",")[0])}</td><td class="n">${inr(val(o))}</td><td class="n">${deliv(o)?inr(deliv(o)):"Free"}</td><td class="n">−${inr(val(o)*COMM)}</td><td class="n">${o.late?"−"+inr(val(o)*LATE):"–"}</td><td class="n"><b>${inr(net(o))}</b></td><td><span class="pill ${o.withdrawn?"":"ok"}">${o.withdrawn?"Withdrawn":"Available"}</span></td></tr>`).join("")}</tbody></table></div></section>
 <section class="card pad sec"><h2 style="margin-bottom:8px">Bank transfers</h2><div class="tw"><table><thead><tr><th>Transfer</th><th>Date</th><th>Account</th><th class="n">Amount</th></tr></thead><tbody>${S.transfers.map(t=>`<tr><td><b>${t.id}</b></td><td>${fmtT(t.at)}</td><td>${esc(t.bank)}</td><td class="n"><b>${inr(t.amt)}</b></td></tr>`).join("")}</tbody></table></div></section>`;
}
function viewPerformance(){
 const x=S.stats,sc=score(),ti=tier(sc),m=(l,v,t)=>`<div><div style="display:flex;justify-content:space-between"><b class="sm">${l}</b><b>${Math.round(v*100)}%</b></div><div class="bar" style="margin:5px 0"><i style="width:${v*100}%;background:${v>=.95?"var(--ok)":v>=.85?"var(--blue)":"var(--bad)"}"></i></div><span class="muted sm">${t}</span></div>`;
 const avg=(S.reviews.reduce((a,r)=>a+r.s,0)/S.reviews.length).toFixed(1),hist=[5,4,3,2,1].map(n=>S.reviews.filter(r=>r.s===n).length);
 return `<div class="head"><div><h1>Performance</h1><p>Your score decides how high you rank in search. It is calculated from your last orders.</p></div></div>
 <div class="grid g2"><section class="card pad"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="ring" style="--p:${sc};--c:var(${sc>=90?"--ok":sc>=80?"--blue":"--bad"})"><b>${sc}</b></div><div style="flex:1;min-width:200px"><h2>Delivery score</h2><p class="pill ${ti[1]}" style="margin:6px 0">${ti[0]}</p><p class="muted sm">90 and above: boosted in search. 80 to 89: normal. Below 80: reduced visibility.</p></div></div><div class="grid" style="margin-top:18px">${m("Acceptance rate",x.accepted/x.offered,"Weight 30%. Accept every order you can fulfil within 4 hours.")}${m("On-time dispatch",x.ontime/Math.max(1,x.dispatched),"Weight 40%. Dispatch within 24 hours of accepting.")}${m("Issue-free deliveries",1-x.issues/Math.max(1,x.delivered),"Weight 30%. Count, condition and item must match the order.")}</div></section>
 <section class="card pad"><div class="ph"><h2>Customer reviews</h2><span class="pill ok">${ic("star",12)} ${avg} average</span></div><div style="margin-bottom:12px">${hist.map((c,i)=>`<div style="display:grid;grid-template-columns:48px 1fr 24px;gap:8px;align-items:center;font-size:13px;margin:3px 0"><span>${5-i} star</span><div class="bar"><i style="width:${c/S.reviews.length*100}%;background:var(--hi2)"></i></div><span>${c}</span></div>`).join("")}</div><div class="list">${S.reviews.map(r=>`<div><span><b>${esc(r.n)}</b> <span style="color:var(--hi2)">${"★".repeat(r.s)}</span><span class="muted">${"★".repeat(5-r.s)}</span><small>${esc(r.p)} · ${r.d} days ago</small>${esc(r.t)}</span></div>`).join("")}</div></section></div>
 <section class="card pad sec"><h2 style="margin-bottom:8px">Why the score matters</h2><div class="grid g3"><div class="note ok">${ic("star",18)}<div><b>90+ gets more orders.</b> Boosted sellers appear first when buyers search.</div></div><div class="note warn">${ic("clock",18)}<div><b>Late dispatch costs money.</b> A ${LATE*100}% penalty is deducted from that order’s payout.</div></div><div class="note info">${ic("shield",18)}<div><b>Proof protects you.</b> Photos at loading and the delivery OTP settle most disputes in your favour.</div></div></div></section>`;
}
function viewSettings(){
 const s=S.store,pr=S.prefs||{},kyc=s.kyc,tgl=(k,l,sub)=>`<div class="tgl"><div><b>${l}</b><div class="muted sm">${sub}</div></div><button class="tg" type="button" role="switch" aria-checked="${pr[k]!==false}" data-act="pref" data-k="${k}" aria-label="${l}"></button></div>`;
 return `<div class="head"><div><h1>Settings</h1><p>Your store profile, verification and alerts.</p></div></div>
 <div class="grid g2"><section class="card pad"><h2 style="margin-bottom:10px">Store details</h2><form id="fStore" class="grid" data-nosubmit="1">${fld("Business name","name",`value="${esc(s.name)}"`)}${fld("GSTIN","gst",`value="${esc(s.gst)}"`)}<div class="two">${fld("Mobile","phone",`value="${esc(s.phone)}" inputmode="numeric" maxlength="10"`)}${fld("City","city",`value="${esc(s.city)}" disabled`)}</div>${fld("Pickup address","addr",`value="${esc(s.addr)}"`)}<button class="btn yellow" type="button" data-act="savestore">Save changes</button></form></section>
 <div class="grid" style="align-content:start"><section class="card pad"><h2 style="margin-bottom:6px">Verification</h2>${[["GST certificate",kyc.gst],["PAN card",kyc.pan],["Cancelled cheque",kyc.cheque]].map(([n,v])=>`<div class="tgl"><span>${ic("doc",16)} ${n}</span>${v==="Verified"?`<span class="pill ok">${ic("check",12)} Verified</span>`:`<button class="btn line sm" type="button" data-act="cheque">Upload (demo)</button>`}</div>`).join("")}${kyc.cheque!=="Verified"?`<div class="note warn" style="margin-top:10px">${ic("alert",18)}<div>Payouts to your bank stay on hold until the cancelled cheque is verified.</div></div>`:""}</section>
 <section class="card pad"><h2 style="margin-bottom:6px">Alerts</h2>${tgl("n1","New order alerts","SMS and push the moment an order arrives")}${tgl("n2","Deadline reminders","1 hour before an accept or dispatch deadline")}${tgl("n3","Low stock alerts","When a product reaches its restock level")}${tgl("n4","Payout notifications","When money is released or transferred")}</section></div></div>`;
}
const VIEWS={overview:viewOverview,orders:viewOrders,products:viewProducts,delivery:viewDelivery,payments:viewPayments,performance:viewPerformance,settings:viewSettings};
A.demotoggle=()=>{$(".demo").classList.toggle("open")};
A.pfilter=(id,t)=>{ui.pf=t.dataset.pf;render()};A.clearq=()=>{ui.q="";$("#gq").value="";render()};

/* ---------- render ---------- */
function render(){
 runTimers();save();
 const unread=S.notifs.filter(n=>!n.read).length,nn=S.orders.filter(o=>o.status==="new").length,dis=S.orders.filter(o=>["disputed"].includes(o.status)).length;
 $("#nav").innerHTML=NAV.map(([id,l,i])=>`<button type="button" data-act="go" data-p="${id}" ${ui.page===id?'aria-current="page"':""}>${ic(i)}<span>${l}</span>${id==="orders"&&nn?`<span class="bd red">${nn}</span>`:""}${id==="products"&&lowStock().length?`<span class="bd">${lowStock().length}</span>`:""}${id==="payments"&&dis?`<span class="bd red">!</span>`:""}</button>`).join("");
 $("#bottom").innerHTML=NAV.map(([id,l,i])=>`<button type="button" data-act="go" data-p="${id}" ${ui.page===id?'aria-current="page"':""}>${ic(i,20)}<span>${l}</span>${id==="orders"&&nn?`<span class="bd red" style="position:absolute;top:0;right:6px;margin:0">${nn}</span>`:""}</button>`).join("");
 $("#bellB").innerHTML=ic("bell")+`<span class="pip">${unread||""}</span>`;
 $("#sbName").textContent=S.store.name;$("#sbSub").textContent=S.store.city+" · Score "+score();
 const v=$("#vac");v.setAttribute("aria-checked",String(!S.vac));$("#stLabel").textContent=S.vac?"Vacation mode":"Accepting orders";
 const focus=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.stock;
 $("#view").innerHTML=VIEWS[ui.page]();
 document.title=NAV.find(n=>n[0]===ui.page)[1]+" · BuildGrid Seller Hub";
 if(focus){const e=$(`[data-stock="${focus}"]`);e&&e.focus()}
 if(ui.page==="overview")bindChart();
}
function bindChart(){
 const box=$("#chart");if(!box)return;const svg=box.querySelector("svg"),R=ui.range,d=S.daily.slice(-R);
 svg.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*640,i=Math.max(0,Math.min(d.length-1,Math.floor((x-46)/((640-52)/d.length))));const t=$("#tip");t.style.opacity=1;t.style.left=((46+(i+.5)*((640-52)/d.length))/640*r.width)+"px";t.style.top=(((240-26-d[i]/(Math.max(...d)*1.1)*(240-36))/240)*r.height)+"px";t.textContent=fmtD(NOW()-(d.length-1-i)*D)+": "+inr(d[i])});
 svg.addEventListener("pointerleave",()=>{$("#tip").style.opacity=0});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 if(!e.target.closest("#npop")&&!e.target.closest("#bellB"))$("#npop").hidden=true;
 const t=e.target.closest("[data-act]");
 if(!t){if(e.target===dlg)closeD();return}
 const f=A[t.dataset.act];if(f){if(t.tagName==="TR"&&e.target.closest("button"))return;f(t.dataset.id,t,e)}
});
document.addEventListener("submit",e=>{
 const f=e.target;if(!f.id)return;e.preventDefault();const g=n=>f.querySelector(`[name=${n}]`),v=n=>g(n).value.trim();
 const err=(n,m)=>{const x=f.querySelector(`[data-e=${n}]`);if(x)x.textContent=m};$$(".ferr",f).forEach(x=>x.textContent="");
 if(f.dataset.nosubmit)return;
 if(f.id==="fDisp"){
  const o=ord(f.dataset.id);let ok=true;
  if(!g("challan").checked){err("challan","Attach the delivery challan");ok=false}if(!g("invoice").checked){err("invoice","Attach the GST invoice");ok=false}
  if(needEway(o)&&!/^\d{12}$/.test(v("eway"))){err("eway","Orders of ₹50,000 or more need a 12-digit e-way bill number");ok=false}
  if(o.bulk&&v("wb").length<3){err("wb","Bulk goods need a weighbridge slip number");ok=false}
  if(!ok)return;
  const vh=veh(v("veh")),d=drv(vh.driver);o.vehicle=vh.id;o.slot=v("slot");o.docs={challan:1,invoice:1};if(needEway(o))o.docs.eway=v("eway");if(o.bulk)o.docs.wb=v("wb");
  o.status="dispatched";S.stats.dispatched++;if(!o.late)S.stats.ontime++;o.events.push({t:NOW(),m:`Dispatched with ${vh.no}${o.late?" (late)":""}, customer OTP generated`});
  save();closeD();render();if(ui.drawer)openDr(o.id);toast("Dispatched. The customer received a delivery OTP");
 }else if(f.id==="fRej"){const o=ord(f.dataset.id);o.status="rejected";countOffer(o);o.issue={type:"Rejected",note:v("why")};o.events.push({t:NOW(),m:"Rejected: "+v("why")});save();closeD();render();if(ui.drawer)openDr(o.id);toast("Rejected. Sent to admin to reassign")}
 else if(f.id==="fProd"){
  let ok=true;const n=v("name"),mrp=+v("mrp"),pr=+v("price"),st=v("stock"),mn=+v("min"),w=+v("w"),ro=v("reorder");
  if(n.length<4){err("name","Enter the full product name");ok=false}if(!(mrp>0)){err("mrp","Enter the MRP");ok=false}
  if(!(pr>0)||pr>mrp){err("price","Price must be above 0 and not more than the MRP");ok=false}if(st===""||+st<0){err("stock","Enter your stock");ok=false}
  if(!(mn>=1)){err("min","Minimum is 1");ok=false}if(!(w>0)){err("w","Enter the weight per unit");ok=false}if(v("unit").length<2){err("unit","Enter a unit");ok=false}
  if(!ok)return;
  const data={name:n,cat:v("cat"),unit:v("unit"),mrp,price:pr,stock:Math.round(+st),min:Math.round(mn),w,reorder:Math.round(+ro||0),bulk:g("bulk").checked};
  if(f.dataset.id){Object.assign(prod(f.dataset.id),data);toast("Product updated")}else{S.products.unshift({id:"p"+(++S.pseq),status:"active",heavy:false,sold:0,...data});toast("Product added and live in search")}
  save();closeD();render();
 }else if(f.id==="fVeh"){
  let ok=true;const no=v("no").toUpperCase().replace(/[\s-]/g,"");
  if(!/^[A-Z]{2}\d{2}[A-Z]{1,3}\d{4}$/.test(no)){err("no","Enter a valid number, like KA01AB4521");ok=false}if(v("type").length<3){err("type","Enter the vehicle type and capacity");ok=false}
  if(v("dn").length<2){err("dn","Enter the driver’s name");ok=false}if(!/^[6-9]\d{9}$/.test(v("ph"))){err("ph","Enter a valid 10-digit mobile number");ok=false}
  if(S.vehicles.some(x=>x.no===no)){err("no","This vehicle is already added");ok=false}if(!ok)return;
  const did="d"+Date.now();S.drivers.push({id:did,name:v("dn"),phone:v("ph")});S.vehicles.push({id:"v"+Date.now(),no,type:v("type"),driver:did});save();closeD();render();toast("Vehicle added");
 }else if(f.id==="fWd"){const b=balance();if(b.avail<1000)return;const id="T-"+(2231+S.transfers.length+1);S.transfers.unshift({id,at:NOW(),amt:b.avail,bank:S.store.bank});S.orders.forEach(o=>{if(o.status==="settled"&&!o.withdrawn)o.withdrawn=true});addNotif(`${inr(b.avail)} is on its way to your bank (${id}).`);save();closeD();render();toast(inr(b.avail)+" withdrawn to your bank")}
 else if(f.id==="fArea"){const p=v("pin"),er=$("#areaErr");er.textContent="";if(!/^[1-9]\d{5}$/.test(p)){er.textContent="Enter a valid 6-digit pincode";return}if(S.areas.includes(p)){er.textContent="That pincode is already on your list";return}S.areas.push(p);save();render();toast("Now delivering to "+p)}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.stock){const p=prod(t.dataset.stock);p.stock=Math.max(0,Math.round(+t.value)||0);if(p.stock===0&&p.status==="active"){p.status="paused";toast("Out of stock, listing paused")}else toast("Stock updated to "+p.stock);save();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDr();$("#npop").hidden=true}});
$("#gq").addEventListener("input",e=>{ui.q=e.target.value;if(ui.q){ui.page="orders";ui.filter="all"}render();$("#gq").focus()});
$("#mk").innerHTML=ic("box",20);$("#sIc").innerHTML=ic("search",18);$("#avt").textContent=S.store.owner.split(" ").map(x=>x[0]).join("");
render();
setInterval(()=>{if(!document.hidden&&!dlg.open&&!document.activeElement.matches("input,textarea,select")){if(runTimers()){save();render()}else if(ui.page==="overview"||ui.page==="orders"){render()}}},30000);
</script>
</body>
