<style>
:root{--bg:#EDF0F4;--panel:#fff;--tint:#F3F5F8;--ink:#0F1B2D;--ink2:#3B4A60;--muted:#5D6B80;--line:#D8DEE6;--nav:#0B1F3A;--nav-mut:#9BADC8;

.kpi{padding:16px;display:grid;gap:6px;align-content:start}.kpi .l{color:var(--muted);font-size:13px;font-weight:600}.kpi b{font:700 28px/1.05 var(--disp);letter-spacing:-.02em}.kpi .r{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.dl{justify-self:start;font-size:12px;font-weight:700;padding:1px 7px;border-radius:10px}.dl.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.dl.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block;overflow:visible}.chart text{fill:var(--muted);font:11px var(--body)}.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;transform:translate(-50%,-130%);white-space:nowrap;opacity:0}

.list>div{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}.list small{color:var(--muted);display:block}.list>div>b{white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--blue)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding-bottom:2px}.tabs button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;white-space:nowrap;display:flex;gap:7px;align-items:center}.tabs button[aria-pressed=true]{background:var(--nav);color:#fff;border-color:var(--nav)}.tabs span{font-size:12px;background:var(--tint);color:var(--ink);border-radius:9px;padding:0 7px}.tabs button[aria-pressed=true] span{background:rgba(255,255,255,.2);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(5,12,24,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}.scrim.on{opacity:1;pointer-events:auto}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}

.note{border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}.note.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}.note.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}.note.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}.note.info{background:color-mix(in srgb,var(--blue) 10%,transparent);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent)}
.banner{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:14px}.banner .btn{margin-left:auto}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none}.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel)}.ring b{position:relative;z-index:1;font:700 19px var(--disp)}
.field{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;min-width:0}textarea.field{height:auto;padding:10px}.fl2{display:grid;gap:4px;font-weight:600;font-size:14px}.ferr{color:var(--bad);font-size:13px;font-weight:500}.ferr:empty{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 28px);overflow:auto}dialog::backdrop{background:rgba(5,12,24,.6)}
.dform{padding:22px;display:grid;gap:12px;position:relative}.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:8px;background:var(--tint);display:grid;place-items:center}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.radio:has(input:checked){border-color:var(--ink);background:var(--tint)}.radio input{margin-top:4px;accent-color:var(--nav)}
.codein{font:700 28px var(--disp);letter-spacing:.4em;text-align:center;height:54px}
.proof{display:grid;gap:4px;font-size:14px;padding:0;margin:6px 0 0;list-style:none}.proof li{display:flex;gap:8px;align-items:center}.proof .y{color:var(--ok)}.proof .no{color:var(--bad)}
.demo{position:fixed;left:calc(244px + 14px);bottom:14px;z-index:70;background:var(--nav);color:#fff;border-radius:14px;padding:8px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow);flex-wrap:wrap;max-width:calc(100vw - 28px)}.demo .dt{display:none}.demo small{color:var(--nav-mut);padding:0 6px;font-weight:600}.demo button{background:rgba(255,255,255,.14);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}.demo button:hover{background:rgba(255,255,255,.26)}.demo .hi{background:var(--hi);color:var(--hi-ink)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:calc(100vw - 24px);width:max-content;font-weight:600}.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--muted);padding:14px 4px}.pr{display:flex;gap:10px;align-items:center;min-width:180px}.pr b{font-weight:650;display:block;line-height:1.25}.avs{width:32px;height:32px;border-radius:50%;background:var(--tint);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.hm{display:grid;grid-template-columns:minmax(0,1.3fr) 80px 110px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.hm:last-child{border:0}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.doc:last-child{border:0}

.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini3 div{background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:12px}.mini3 b{display:block;font:700 26px/1 var(--disp)}.mini3 span{font-size:13px;color:var(--muted)}
.bottom{display:none}

@media (max-width:760px){.app{display:block}.side{display:none}.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--nav);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:0}.bottom button{flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--nav-mut);padding:6px 1px;border-radius:10px;position:relative}.bottom button[aria-current=page]{background:var(--hi);color:var(--hi-ink)}
 .demo{bottom:70px;left:8px}.demo .dt{display:block}.demo small{display:none}.demo:not(.open) button:not(.dt){display:none}.toast{bottom:130px}.two{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.tl li{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr!important}.act{flex-direction:column;align-items:flex-start;gap:4px}.act .n{font-size:24px}.head .btn{flex:1}.hm{grid-template-columns:1fr 100px}.hm>:nth-child(2){display:none}.chip2{display:none}.mini3{grid-template-columns:1fr 1fr 1fr}.mini3 b{font-size:22px}}

<body>
<div class="app">
 <aside class="side">
  <div class="brand"><div class="mk" id="mk"></div><div><b>BuildGrid</b><small>Platform Admin</small></div></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="sp"></div>
  <div class="me"><div class="av">AR</div><div><b>Asha Reddy</b><span>Admin · 2FA on</span></div></div>
 </aside>
 <div class="mainc">
  <header class="top">
   <label class="search"><span id="sIc"></span><span class="sr">Search users and sellers</span><input id="gq" type="search" placeholder="Search users and sellers" autocomplete="off"></label>
   <div class="tp"><span class="chip2" id="tfa"></span><button class="ib" type="button" data-act="bell" aria-label="Notifications" id="bellB"></button></div>
  </header>
  <div class="pop" id="npop" hidden></div>
  <main id="view" tabindex="-1"></main>
 </div>
</div>
<nav class="bottom" id="bottom" aria-label="Main mobile"></nav>
<div class="scrim" id="scrim" data-act="closedr"></div>
<aside class="dr" id="dr" aria-label="Details"></aside>
<dialog id="dlg"></dialog>
<div class="demo" role="group" aria-label="Demo controls"><button type="button" class="dt" data-act="demotoggle">Demo controls</button><small>Demo</small><button type="button" class="hi" data-act="simsignup">New seller applies</button><button type="button" data-act="simdispute">New dispute</button><button type="button" data-act="reset">Reset</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
function pickStore(){try{const s=window.localStorage;s.setItem("__t","1");s.removeItem("__t");s.real=true;return s}catch(e){const m={};return {real:false,getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}}
const LS=pickStore(),KEY="buildgrid_platform_admin_v3";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

 /* settings */
 saverules(){const f=$("#fRules"),R={commission:[0,15,"Commission"],accept:[1,24,"Accept window"],dispatch:[4,72,"Dispatch deadline"],review:[1,72,"Review window"],penalty:[0,10,"Late penalty"],maxAttempts:[1,5,"Delivery attempts"],secondCheck:[100000,50000000,"Second-check amount"]};let bad=false;const ch=[];

 <div class="card pad"><h3 style="margin-bottom:6px">Documents (${a.docs.filter(d=>d[1]==="Verified").length} of ${a.docs.length} verified)</h3>${a.docs.map((d,i)=>`<div class="doc"><span>${ic("log",16)} ${esc(d[0])}</span><span style="display:flex;gap:6px;align-items:center"><span class="pill ${pv[d[1]]||""}">${esc(d[1])}</span>${a.status==="pending"?d[1]==="Needs review"?`<button class="btn line sm" type="button" data-act="verify" data-ap="${a.id}" data-i="${i}">Mark verified</button>`:d[1]==="Mismatch"?`<button class="btn line sm" type="button" data-act="resub" data-ap="${a.id}" data-i="${i}">Ask to resubmit</button>`:"":""}</span></div>`).join("")}</div>
 ${a.status==="pending"?(ready?`<div class="note ok">${ic("check",18)}<div>Everything is verified. You can approve this application.</div></div>`:`<div class="note info">${ic("lock",18)}<div>Approval stays locked until ${docsOk?"delivery is set up":delOk?"every document is verified":"every document is verified and delivery is set up"}.</div></div>`):""}`,

  <section class="card"><div class="tw"><table><thead><tr><th>Order</th><th>Seller</th><th>Delivered by</th><th>Truck and driver</th><th>Going to</th><th>Slot</th><th>Status</th><th></th></tr></thead><tbody>${l.map(x=>{const fl=flagsFor(x),s=stl[x.status];return `<tr><td style="white-space:nowrap"><b>${x.order}</b></td><td>${esc(x.seller)}<br><span class="muted sm">${esc(catOf(x.seller))}</span></td><td><span class="pill ${x.by==="own"?"info":"warn"}">${x.by==="own"?"Own truck":x.by==="hired"?"Hired":"Own and hired"}</span></td><td><b style="font-weight:650">${esc(x.truck)}</b><br><span class="muted sm">${esc(x.driver)} · ${esc(x.phone)}</span></td><td>${esc(x.city)} ${esc(x.pin)}</td><td>${esc(x.slot)}</td><td><span class="pill ${s[1]}">${s[0]}</span> ${x.status==="road"?`<span class="muted sm">${x.h} h</span>`:""}<br>${fl.map(g=>`<span class="pill ${g[0]}" style="margin-top:3px">${ic("flag",11)} ${g[1]}</span>`).join(" ")}</td><td class="n" style="white-space:nowrap">${x.by!=="own"&&!x.verified?`<button class="btn yellow sm" type="button" data-act="lverify" data-id="${x.id}">Verify truck</button> `:""}${x.status==="road"&&x.h>=6?`<button class="btn line sm" type="button" data-act="lremind" data-id="${x.id}">Ask for update</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="8" class="empty">Nothing here.</td></tr>`}</tbody></table></div></section>`;
 }
 const secs=Object.keys(EXT).map(k=>{const l=openEx(k);return `<section class="card pad"><div class="ph"><div><h2>${EXT[k][0]}</h2><span class="muted sm">${EXT[k][2]}</span></div><span class="pill ${l.length?EXT[k][1]:"ok"}">${l.length} open</span></div>${l.length?l.map(exRow).join(""):`<p class="empty">Nothing open. Nice.</p>`}</section>`}).join("");
 return `<div class="head"><div><h1>Deliveries</h1><p>Orders that did not go to plan. The money stays held until you decide. Settle disputes within 24 hours, using the seller’s loading photo, documents and OTP record.</p></div></div>${tabs}<div class="grid g2">${secs}</div>`;
}
function viewPayouts(){
 const paid=S.payouts.filter(p=>p.status==="paid").reduce((a,p)=>a+p.amount,0),pst={pending:["Waiting for you","warn"],approved:["Approved, scheduled","ok"],paid:["Paid","ok"],held:["On hold","bad"]},c=S.checker;
 return `${S.frozen?`<div class="banner" role="status">${ic("lock",20)}<div><b>All payouts are paused.</b> Nothing can be approved until you resume.</div><button class="btn line sm" type="button" data-act="pause">Resume payouts</button></div>`:""}
 <div class="head"><div><h1>Payouts</h1><p>Customer money is held in escrow and goes to sellers only after delivery is accepted. Delivery charges go to the seller, who pays for the trucks. Big batches need a second check.</p></div><button class="btn line" type="button" data-act="pexport">${ic("dl",16)} Export CSV</button></div>
 <div class="grid g4"><div class="card kpi"><span class="l">Held in escrow</span><b>${lk(escrow())}</b></div><div class="card kpi"><span class="l">Paid to sellers, 30 days</span><b>${lk(paid)}</b></div><div class="card kpi"><span class="l">Your earnings, 30 days</span><b>${lk(earnings(30))}</b></div><div class="card kpi"><span class="l">Refunded to customers</span><b>${lk(refunded())}</b><span class="muted sm">${(refunded()/S.gmv30*100).toFixed(2)}% of sales</span></div></div>
 <section class="card pad sec"><div class="ph"><h2>Payout batches</h2><span class="muted sm">Second check from ${lk(S.rules.secondCheck)}</span></div><div class="tw"><table><thead><tr><th>Batch</th><th>Date</th><th class="n">Sellers</th><th class="n">Amount</th><th>Status</th><th></th></tr></thead><tbody>${S.payouts.map(p=>`<tr><td><b>${p.id}</b><br><span class="muted sm">${esc(p.note)}</span></td><td>${fmtD(p.date)}</td><td class="n">${p.vendors}</td><td class="n"><b>${lk(p.amount)}</b>${p.amount>=S.rules.secondCheck?`<br><span class="muted sm">${ic("lock",11)} second check</span>`:""}</td><td><span class="pill ${pst[p.status][1]}">${pst[p.status][0]}</span></td><td class="n">${p.status==="pending"?`<button class="btn yellow sm" type="button" data-act="payok" data-id="${p.id}">Approve</button> <button class="btn line sm" type="button" data-act="payhold" data-id="${p.id}">Hold</button>`:p.status==="held"?`<button class="btn line sm" type="button" data-act="payrelease" data-id="${p.id}">Release hold</button>`:""}</td></tr>`).join("")}</tbody></table></div></section>
 <div class="grid g2 sec"><section class="card pad"><h2 style="margin-bottom:6px">Your trusted checker</h2><p class="muted sm" style="margin-bottom:10px">For big payouts, ${esc(c.name)} receives a code and confirms with you. Change the checker in Settings.</p><div class="list"><div><span>${esc(c.name)}<small>${esc(c.role)} · phone ending ${esc(c.phone.slice(-4))}</small></span><span class="pill ok">${ic("check",11)} Active</span></div></div></section>
 <section class="card pad"><h2 style="margin-bottom:6px">Emergency stop</h2><p class="muted sm" style="margin-bottom:10px">Pause every seller payout at once, for suspected fraud or a payment gateway problem.</p><button class="btn ${S.frozen?"yellow":"red"}" type="button" data-act="pause">${S.frozen?"Resume all payouts":"Pause all payouts"}</button></section></div>`;
}
function viewVendors(){
 const all=[...S.vendors].sort((a,b)=>score(b)-score(a)),cnt=k=>all.filter(v=>tier(v)[0]===k).length,cats=["all",...CATS.filter(c=>all.some(v=>v.cat===c))];
 if(!cats.includes(ui.vcat))ui.vcat="all";const l=all.filter(v=>ui.vcat==="all"||v.cat===ui.vcat);
 return `<div class="head"><div><h1>Sellers</h1><p>Every seller sells in one category. The score decides who ranks first in search within that category. Check how each seller delivers, then warn, change commission or suspend, always with a reason.</p></div></div>
 <div class="grid g4"><div class="card kpi"><span class="l">Boosted (90 and above)</span><b style="color:var(--ok)">${cnt("Boosted")}</b></div><div class="card kpi"><span class="l">Normal (80 to 89)</span><b>${cnt("Normal")}</b></div><div class="card kpi"><span class="l">Reduced (below 80)</span><b style="color:var(--bad)">${cnt("Reduced")}</b></div><div class="card kpi"><span class="l">Suspended</span><b>${cnt("Suspended")}</b></div></div>
 <div class="tabs sec">${cats.map(c=>`<button type="button" data-act="vcat" data-c="${esc(c)}" aria-pressed="${ui.vcat===c}">${c==="all"?"All categories":esc(c)}<span>${c==="all"?all.length:all.filter(v=>v.cat===c).length}</span></button>`).join("")}</div>
 <section class="card"><div class="tw"><table><thead><tr><th>Seller</th><th>Category</th><th>Score</th><th>Delivers by</th><th class="n">On-time</th><th class="n">Failed</th><th class="n">Loading photo</th><th class="n">30-day sales</th><th>Ranking</th></tr></thead><tbody>${l.map(v=>{const sc=score(v),t=tier(v),x=v.st,fr=failRate(v);return `<tr class="clk" data-act="vopen" data-id="${v.id}"><td><div class="pr"><span class="avs">${esc(v.name[0])}</span><div><b>${esc(v.name)}</b><span class="muted sm">${esc(v.city)} · ${v.comm}% commission${v.warn?` · ${v.warn} warning${v.warn>1?"s":""}`:""}</span></div></div></td><td><span class="pill info">${esc(v.cat)}</span></td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="width:70px"><i style="width:${sc}%;background:${sc>=90?"var(--ok)":sc>=80?"var(--blue)":"var(--bad)"}"></i></div><b>${sc}</b></div></td><td>${v.mode==="own"?"Own trucks ("+v.trucks+")":v.mode==="hired"?"Hired transporters":"Own ("+v.trucks+") and hired"}</td><td class="n">${Math.round(x.ontime/Math.max(1,x.dispatched)*100)}%</td><td class="n"><b style="color:${fr>5?"var(--bad)":"inherit"}">${fr.toFixed(1)}%</b></td><td class="n"><b style="color:${v.photoRate<90?"var(--bad)":"inherit"}">${v.photoRate}%</b></td><td class="n">${lk(v.gmv)}</td><td><span class="pill ${t[1]}">${t[0]}</span></td></tr>`}).join("")||`<tr><td colspan="9" class="empty">No sellers in this category.</td></tr>`}</tbody></table></div></section>`;
}
A.vcat=(id,t)=>{ui.vcat=t.dataset.c;render()};
function viewUsers(){
 const q=ui.q.toLowerCase(),base=S.users.filter(u=>!q||(u.name+u.id+u.city+(u.cat||"")).toLowerCase().includes(q)),
  tabs=[["all","All",base.length],["customer","Customers",base.filter(u=>u.role==="customer").length],["vendor","Sellers",base.filter(u=>u.role==="vendor").length],["susp","Suspended",base.filter(u=>u.status==="suspended").length]],
  l=base.filter(u=>ui.utab==="all"||(ui.utab==="susp"?u.status==="suspended":u.role===ui.utab));
 return `<div class="head"><div><h1>Users</h1><p>${base.length} accounts: customers who buy, and sellers who sell in one category each. Click a row to see details or suspend an account.</p></div><button class="btn line" type="button" data-act="uexport">${ic("dl",16)} Export CSV</button></div>
 ${q?`<div class="note info" style="margin-bottom:12px">${ic("search",16)}<div>Showing results for “${esc(ui.q)}”. <button class="btn line sm" type="button" data-act="clearq">Clear</button></div></div>`:""}
 <div class="tabs">${tabs.map(([k,n,c])=>`<button type="button" data-act="utab" data-u="${k}" aria-pressed="${ui.utab===k}">${n}<span>${c}</span></button>`).join("")}</div>
 <section class="card"><div class="tw"><table><thead><tr><th>User</th><th>Type</th><th>Category</th><th>City</th><th>Status</th><th>Joined</th><th class="n">Orders</th><th class="n">Value</th></tr></thead><tbody>${l.map(u=>`<tr class="clk" data-act="uopen" data-id="${u.id}"><td><div class="pr"><span class="avs">${esc(u.name[0])}</span><div><b>${esc(u.name)}</b><span class="muted sm">${u.id}</span></div></div></td><td>${ROLEL[u.role]}</td><td>${u.cat?`<span class="pill info">${esc(u.cat)}</span>`:`<span class="muted">–</span>`}</td><td>${esc(u.city)}</td><td><span class="pill ${u.status==="active"?"ok":"bad"}">${u.status}</span>${u.flags.length?` <span class="pill bad">${ic("flag",11)}</span>`:""}</td><td>${fmtD(u.joined)}</td><td class="n">${u.orders}</td><td class="n">${lk(u.gmv)}</td></tr>`).join("")||`<tr><td colspan="8" class="empty">No users match.</td></tr>`}</tbody></table></div></section>`;
}
function viewLog(){
 const l=auditList(),types=["all",...new Set(S.audit.map(a=>a.type))];
 return `<div class="head"><div><h1>Activity log</h1><p>Every important action is saved here with what you did and why. Entries cannot be changed or deleted.</p></div><button class="btn line" type="button" data-act="auexport">${ic("dl",16)} Export CSV</button></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px"><label class="search" style="max-width:320px">${ic("search",18)}<span class="sr">Search the activity log</span><input id="aq" type="search" placeholder="Search actions, names, reasons" value="${esc(ui.aq)}"></label><select class="field" id="typeSel" style="width:auto" aria-label="Area">${types.map(a=>`<option value="${a}" ${ui.atype===a?"selected":""}>${a==="all"?"All areas":a}</option>`).join("")}</select></div>
 <section class="card"><div class="tw"><table><thead><tr><th>When</th><th>Action</th><th>Target</th><th>Detail</th><th>Reason</th></tr></thead><tbody>${l.slice(0,80).map(a=>`<tr><td style="white-space:nowrap">${fmtT(a.t)}</td><td><b>${esc(a.action)}</b><br><span class="pill">${a.type}</span></td><td>${esc(a.target)}</td><td>${esc(a.detail)}</td><td>${esc(a.reason)||`<span class="muted">–</span>`}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No entries match.</td></tr>`}</tbody></table></div></section>`;
}
function viewSettings(){
 const r=S.rules,c=S.checker,f=(k,l,u,h)=>`<label class="fl2">${l}${u?` <span class="muted sm" style="font-weight:400">(${u})</span>`:""}<input class="field" name="${k}" type="number" step="any" value="${r[k]}"><span class="ferr" data-e="${k}"></span>${h?`<span class="muted sm" style="font-weight:400">${h}</span>`:""}</label>`,tg=(k,l,sub)=>`<div class="tgl"><div><b>${l}</b><div class="muted sm">${sub}</div></div><button class="tg" type="button" role="switch" aria-checked="${S.policy[k]}" data-act="policy" data-k="${k}" aria-label="${l}"></button></div>`;
 return `<div class="head"><div><h1>Settings</h1><p>The rules that keep seller deliveries honest. Every change asks for a reason and is saved in the activity log.</p></div></div>
 <div class="grid g2"><section class="card pad"><h2 style="margin-bottom:10px">Marketplace rules</h2><form id="fRules" data-nosubmit="1" class="grid"><div class="two">${f("commission","Commission","% of item value")}${f("penalty","Late dispatch penalty","% of item value")}</div><div class="two">${f("accept","Seller must accept within","hours")}${f("dispatch","Seller must dispatch within","hours")}</div><div class="two">${f("review","Customer review window","hours")}${f("maxAttempts","Delivery attempts allowed","before refund")}</div>${f("secondCheck","Payouts needing a second check","₹ and above")}<button class="btn yellow" type="button" data-act="saverules">Review and save changes</button></form></section>
 <div class="grid" style="align-content:start"><section class="card pad"><h2 style="margin-bottom:6px">Delivery proof policy</h2><p class="muted sm" style="margin-bottom:6px">Since sellers deliver, this proof is what lets you settle disputes fairly.</p>${tg("loadPhoto","Loading photo required before dispatch","Shows the count and condition when the truck left")}${tg("otp","Delivery OTP required","The customer’s code confirms the goods arrived")}${tg("hired","Sellers may use hired transporters","Turn off to allow only sellers’ own trucks")}</section>
 <section class="card pad"><h2 style="margin-bottom:6px">Trusted checker</h2><p class="muted sm" style="margin-bottom:10px">The person who confirms big payouts with a code. Choose someone other than yourself.</p><form id="fChecker" data-nosubmit="1" class="grid"><div class="two"><label class="fl2">Name<input class="field" name="name" value="${esc(c.name)}"><span class="ferr" data-e="name"></span></label><label class="fl2">Role<input class="field" name="role" value="${esc(c.role)}"><span class="ferr" data-e="role"></span></label></div><label class="fl2">Mobile for the code<input class="field" name="phone" inputmode="numeric" maxlength="10" value="${esc(c.phone)}"><span class="ferr" data-e="phone"></span></label><button class="btn line" type="button" data-act="savechecker">Save checker</button></form></section>
 <section class="card pad"><h2 style="margin-bottom:6px">Your account</h2><div class="tgl"><div><b>Two-factor sign-in</b><div class="muted sm">Required for the admin account. It cannot be turned off.</div></div><span class="pill ok">${ic("lock",11)} On</span></div></section></div></div>`;
}
const VIEWS={overview:viewOverview,approvals:viewApprovals,deliveries:viewDeliveries,payouts:viewPayouts,vendors:viewVendors,users:viewUsers,log:viewLog,settings:viewSettings};

/* ---------- render ---------- */
function render(){
 save();
 const badge=id=>{const m={approvals:[pendingAp().length,"red"],deliveries:[openEx().length,"red"],payouts:[waitPay().length,""]}[id];return m&&m[0]?`<span class="bd ${m[1]}">${m[0]}</span>`:""};
 $("#nav").innerHTML=NAV.map(([id,l,i])=>`<button type="button" data-act="go" data-p="${id}" ${ui.page===id?'aria-current="page"':""}>${ic(i)}<span>${l}</span>${badge(id)}</button>`).join("");
 $("#bottom").innerHTML=NAV.map(([id,l,i])=>`<button type="button" data-act="go" data-p="${id}" ${ui.page===id?'aria-current="page"':""}>${ic(i,20)}<span>${l.replace("Activity log","Log").replace("Deliveries","Delivery").replace("Approvals","Approve").replace("Overview","Home")}</span>${badge(id).replace('class="bd','style="position:absolute;top:0;right:2px;margin:0" class="bd')}</button>`).join("");
 const un=S.notifs.filter(n=>!n.read).length;$("#bellB").innerHTML=ic("bell")+`<span class="pip">${un||""}</span>`;
 $("#tfa").innerHTML=ic("lock",13)+"<span>Two-factor on</span>";
 const keep=document.activeElement&&document.activeElement.id;
 $("#view").innerHTML=VIEWS[ui.page]();
 document.title=NAV.find(n=>n[0]===ui.page)[1]+" · BuildGrid Platform Admin";
 if(keep==="aq"){const e=$("#aq");if(e){e.focus();e.setSelectionRange&&e.setSelectionRange(e.value.length,e.value.length)}}
 if(ui.page==="overview")bindChart();
}
function bindChart(){
 const box=$("#chart");if(!box)return;const c=areaChart(),svg=box.querySelector("svg"),m=c.d.length;
 svg.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*c.W,i=Math.max(0,Math.min(m-1,Math.round((x-c.pl)/((c.W-c.pl-c.pr)/(m-1)))));
  $("#cl").setAttribute("x1",c.X(i));$("#cl").setAttribute("x2",c.X(i));$("#cl").setAttribute("opacity",1);const d=$("#cd");d.setAttribute("cx",c.X(i));d.setAttribute("cy",c.Y(c.d[i]));d.setAttribute("opacity",1);
  const t=$("#tip");t.style.opacity=1;t.style.left=c.X(i)/c.W*r.width+"px";t.style.top=c.Y(c.d[i])/c.Ht*r.height+"px";t.textContent=fmtD(Date.now()-(m-1-i)*D)+": "+lk(c.d[i])});
 svg.addEventListener("pointerleave",()=>{["#cl","#cd"].forEach(s=>$(s).setAttribute("opacity",0));$("#tip").style.opacity=0});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 if(!e.target.closest("#npop")&&!e.target.closest("#bellB"))$("#npop").hidden=true;
 const t=e.target.closest("[data-act]");if(!t){if(e.target===dlg)closeD();return}
 if(t.disabled)return;const f=A[t.dataset.act];if(f){if(t.tagName==="TR"&&e.target.closest("button")&&e.target.closest("button")!==t)return;f(t.dataset.id,t,e)}
});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button[type=submit],input[type=submit]");if(!b||!b.form||b.disabled)return;e.preventDefault();b.form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}))},true);
document.addEventListener("submit",e=>{
 const f=e.target;if(!f.id)return;e.preventDefault();$$(".ferr",f).forEach(x=>x.textContent="");const g=n=>f.querySelector(`[name=${n}]`),v=n=>g(n).value.trim(),err=(n,m)=>{const x=f.querySelector(`[data-e=${n}]`);if(x)x.textContent=m};
 if(f.dataset.nosubmit)return;
 const needReason=()=>{if(v("reason").length<8){err("reason","Give a reason of at least 8 characters. It is saved in the activity log.");return false}return true};
 if(f.id==="fReason"){if(!needReason())return;const cb=CB;if(cb&&cb(v("reason"),f)===false)return}
 else if(f.id==="fTyped"){if(v("w")!==f.dataset.w){err("w","Type "+f.dataset.w+" exactly");return}if(!needReason())return;CB&&CB(v("reason"),f)}
 else if(f.id==="fSecond"){
  const p=S.payouts.find(x=>x.id===SC.id),code=v("code");
  if(!/^\d{4}$/.test(code)){err("code","Enter the 4-digit code");return}
  if(code!==SC.code){SC.tries++;if(SC.tries>=3){SC.sent=false;SC.code=null;renderSecond();toast("Too many wrong codes. Send a new one.");return}err("code","That code is not right. "+(3-SC.tries)+" tries left.");return}
  p.status="approved";audit("payouts","Approved payout batch",p.id,lk(p.amount)+" to "+p.vendors+" sellers, second check passed by "+S.checker.name,SC.reason);SC=null;save();closeD();render();toast(p.id+" approved with a second check")}
 else if(f.id==="fRes"){const e2=S.exceptions.find(x=>x.id===f.dataset.id),mode=f.querySelector("[name=mode]:checked").value,amt=Math.round(+v("amt"));
  if(!needReason())return;if(mode==="part"&&!(amt>0&&amt<=e2.amount)){err("amt","Enter an amount between 1 and "+e2.amount);return}
  const ref=mode==="full"?e2.amount:mode==="part"?amt:0,vd=S.vendors.find(x=>x.name===e2.vendor);if(vd&&ref>0)vd.st.issues++;S.extra.refunded+=ref;S.exceptions=S.exceptions.filter(x=>x.id!==e2.id);
  audit("ops",mode==="none"?"Rejected claim":mode==="full"?"Refunded in full":"Partial refund",e2.order,(ref?inr(ref)+" to "+e2.customer+"; ":"")+e2.reason+" ("+e2.vendor+")",v("reason"));save();closeD();render();toast(mode==="none"?"Claim rejected, payout released":inr(ref)+" refunded to "+e2.customer)}
 else if(f.id==="fRea"){if(!needReason())return;const e2=S.exceptions.find(x=>x.id===f.dataset.id),nv=v("v").split(" · ")[0],vd=S.vendors.find(x=>x.name===nv);S.exceptions=S.exceptions.filter(x=>x.id!==e2.id);if(vd)vd.st.offered++;audit("ops","Reassigned order",e2.order,e2.vendor+" to "+nv,v("reason"));notify(`${e2.order} reassigned to ${nv}`);save();closeD();render();toast("Reassigned to "+nv)}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="aq"){ui.aq=t.value;render()}if(t.closest&&t.closest(".fl2")&&t.name!=="w"){const er=t.closest(".fl2").querySelector(".ferr");if(er)er.textContent=""}});
document.addEventListener("change",e=>{if(e.target.id==="typeSel"){ui.atype=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDr();$("#npop").hidden=true}});
$("#gq").addEventListener("input",e=>{ui.q=e.target.value;if(ui.q&&ui.page!=="users"){ui.page="users";ui.utab="all"}render();$("#gq").focus()});
$("#mk").innerHTML=ic("shield",20);$("#sIc").innerHTML=ic("search",18);
render();
</script>
